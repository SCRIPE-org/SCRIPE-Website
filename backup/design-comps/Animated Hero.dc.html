<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1376,&quot;height&quot;:768},&quot;parallax&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;guides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;}}">
class Component extends DCLogic {
  rootRef = (el) => { this._root = el; };
  stageRef = (el) => { this._stage = el; };
  scaleRef = (el) => { this._scale = el; };
  worldRef = (el) => { this._world = el; };
  nearRef = (el) => { this._near = el; };

  componentDidMount() {
    const root = this._root;
    if (!root) return;
    this._reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    root.style.setProperty('--spd', String(this.props.speed ?? 1));
    this._ro = new ResizeObserver((es) => {
      const w = es[0].contentRect.width;
      if (this._scale) this._scale.style.transform = 'scale(' + (w / 1376) + ')';
    });
    this._ro.observe(root);
    this._tx = 0; this._ty = 0; this._cx = 0; this._cy = 0;
    this._onMove = (e) => {
      const r = root.getBoundingClientRect();
      this._tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      this._ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
    };
    this._onLeave = () => { this._tx = 0; this._ty = 0; };
    root.addEventListener('pointermove', this._onMove);
    root.addEventListener('pointerleave', this._onLeave);
    const tick = (t) => {
      this._raf = requestAnimationFrame(tick);
      if (this._reduced || this._focused) return;
      const k = this.props.parallax ?? 1;
      const ix = Math.sin(t / 11000 * Math.PI * 2) * 0.22;
      const iy = Math.cos(t / 14000 * Math.PI * 2) * 0.18;
      const gx = (this._tx + ix) * k, gy = (this._ty + iy) * k;
      this._cx += (gx - this._cx) * 0.055;
      this._cy += (gy - this._cy) * 0.055;
      const x = this._cx, y = this._cy;
      if (this._world) this._world.style.transform = 'translate3d(' + (x * 7).toFixed(2) + 'px,' + (y * 5).toFixed(2) + 'px,0) rotateY(' + (x * 0.55).toFixed(3) + 'deg) rotateX(' + (-y * 0.4).toFixed(3) + 'deg)';
      if (this._near) this._near.style.transform = 'translate3d(' + (x * 12).toFixed(2) + 'px,' + (y * 8.5).toFixed(2) + 'px,0)';
    };
    this._raf = requestAnimationFrame(tick);
    window.__hero = {
      guides: (b) => { root.dataset.guides = b ? 'on' : 'off'; },
      focus: (fx, fy, z) => {
        const st = this._stage;
        if (!st) return;
        if (fx == null) { st.style.transform = ''; st.style.transformOrigin = ''; this._focused = false; return; }
        this._focused = true;
        st.style.transformOrigin = (fx / 1376 * 100) + '% ' + (fy / 768 * 100) + '%';
        st.style.transform = 'scale(' + (z || 3) + ')';
      }
    };
  }
  componentDidUpdate() {
    if (this._root) this._root.style.setProperty('--spd', String(this.props.speed ?? 1));
  }
  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
    if (this._ro) this._ro.disconnect();
    if (this._root) {
      this._root.removeEventListener('pointermove', this._onMove);
      this._root.removeEventListener('pointerleave', this._onLeave);
    }
  }
  renderVals() {
    return {
      rootRef: this.rootRef, stageRef: this.stageRef, scaleRef: this.scaleRef,
      worldRef: this.worldRef, nearRef: this.nearRef,
      guidesAttr: (this.props.guides ?? false) ? 'on' : 'off'
    };
  }
}
